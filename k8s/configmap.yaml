# Non-secret app settings, injected as environment variables (see app/config.py, prefix APP_)
apiVersion: v1
kind: ConfigMap
metadata:
  name: csv-records-api-config
  namespace: csv-api
data:
  APP_MAX_PAGE_SIZE: "100"
  # First start on an empty database: the table is filled from this CSV (baked into the image)
  APP_SEED_CSV: "/app/data/employees.csv"
