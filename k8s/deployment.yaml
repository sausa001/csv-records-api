apiVersion: apps/v1
kind: Deployment
metadata:
  name: csv-records-api
  namespace: csv-api
  labels:
    app: csv-records-api
spec:
  # One replica: the API keeps records in memory and writes them to one CSV file.
  # Several replicas would each hold their own copy and drift apart.
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: csv-records-api
  strategy:
    type: Recreate          # stop the old pod before starting the new one (single writer)
  template:
    metadata:
      labels:
        app: csv-records-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001       # matches appuser in the Dockerfile
        fsGroup: 1001
      initContainers:
        # First start only: copy the CSV baked into the image onto the empty volume.
        # Later deploys keep the existing file, so UI edits are not lost.
        - name: seed-data
          image: docker.io/saket123/csv-records-api:latest
          command:
            - sh
            - -c
            - |
              if [ ! -f /data/employees.csv ]; then
                cp /app/data/employees.csv /data/employees.csv && echo "Seeded /data/employees.csv"
              else
                echo "Keeping existing /data/employees.csv"
              fi
              chown -R 1001:1001 /data
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: api
          # Jenkins replaces this tag on every deploy (jenkins-<build>-<sha>)
          image: docker.io/saket123/csv-records-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: csv-records-api-config
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: csv-records-api-data
